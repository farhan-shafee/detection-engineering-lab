name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test detection and investigation behavior
        run: python -m unittest discover -s tests -v
      - name: Validate metadata, Sigma, fixtures, and evidence
        run: python -m detection_lab validate
      - name: Compare deterministic demo with reviewed evidence
        run: python -m detection_lab demo --check
      - name: Verify Windows demo wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./demo/run-demo.ps1 -Check
      - name: Check repository security boundaries
        run: python scripts/security_check.py
      - name: Scan Python source for security findings
        run: python -m bandit -r detection_lab scripts
      - name: Audit installed dependencies
        run: python -m pip_audit
