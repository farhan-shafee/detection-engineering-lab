# Copy beside the pinned upstream single-node/docker-compose.yml.
# Requires Docker Compose >= 2.24.4 for !override (ordinary merge retains ports).
# Supply private .env values and matching upstream password hashes BEFORE startup.
services:
  wazuh.manager:
    restart: "no"
    ports: !override
      - "127.0.0.1:1514:1514/tcp"
      - "127.0.0.1:1515:1515/tcp"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:?Set a unique private indexer password}
      API_PASSWORD: ${API_PASSWORD:?Set a unique private API password}
  wazuh.indexer:
    restart: "no"
    ports: !override []
  wazuh.dashboard:
    restart: "no"
    ports: !override
      - "127.0.0.1:8443:5601/tcp"
    environment:
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:?Set a unique private indexer password}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set a unique private dashboard service password}
      API_PASSWORD: ${API_PASSWORD:?Set a unique private API password}
