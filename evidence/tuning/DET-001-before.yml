title: Encoded PowerShell Process Requiring Review
id: 55dd48b2-ed6f-42a4-8f6f-06fe4d4fcb22
status: experimental
description: Detects encoded PowerShell switches; content and authorization require analyst review.
author: Detection Engineering Lab
date: 2026-09-07
license: MIT
references:
    - https://attack.mitre.org/techniques/T1059/001/
logsource:
    product: windows
    service: sysmon
    category: process_creation
    definition: Sysmon Event ID 1 with full command line and parent image.
detection:
    selection:
        EventID: 1
        Channel: 'Microsoft-Windows-Sysmon/Operational'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|re: '(?i)(?:^|\s)-(?:enc|encodedcommand)(?:\s|$)'
    condition: selection
fields:
    - Computer
    - User
    - Image
    - ParentImage
    - CommandLine
falsepositives:
    - Approved deployment and automation frameworks.
level: medium
tags:
    - attack.execution
    - attack.t1059.001
