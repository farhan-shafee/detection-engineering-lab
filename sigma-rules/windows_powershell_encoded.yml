title: Suspicious PowerShell Encoded Command
id: 55dd48b2-ed6f-42a4-8f6f-06fe4d4fcb22
status: experimental
description: Detects possible obfuscated PowerShell using EncodedCommand.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Portfolio Lab
date: 2026-04-29
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\\powershell.exe'
    CommandLine|contains:
      - '-enc '
      - '-encodedcommand '
  condition: selection
fields:
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Legitimate scripted administration workflows.
level: medium
tags:
  - attack.execution
  - attack.t1059.001
